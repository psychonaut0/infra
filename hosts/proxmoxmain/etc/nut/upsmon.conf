# NUT secondary: the UPS (Atlantis A03-HP2003) is on proxmoxnode's USB.
# This host shuts itself down after 3 min on battery (upssched), so the
# battery is left for proxmoxnode and the network gear.
MONITOR atlantis@192.168.3.3 1 upsmon-secondary <NUT_SECONDARY_PASSWORD> secondary
MINSUPPLIES 1
SHUTDOWNCMD "/sbin/shutdown -h +0"
NOTIFYCMD /usr/sbin/upssched
POLLFREQ 5
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 25
FINALDELAY 5
NOCOMMWARNTIME 300

NOTIFYFLAG ONLINE   SYSLOG+WALL+EXEC
NOTIFYFLAG ONBATT   SYSLOG+WALL+EXEC
NOTIFYFLAG LOWBATT  SYSLOG+WALL
NOTIFYFLAG FSD      SYSLOG+WALL
NOTIFYFLAG COMMOK   SYSLOG
NOTIFYFLAG COMMBAD  SYSLOG
NOTIFYFLAG SHUTDOWN SYSLOG+WALL
NOTIFYFLAG NOCOMM   SYSLOG
