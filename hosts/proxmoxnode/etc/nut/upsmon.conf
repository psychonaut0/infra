# NUT primary: the UPS USB cable is on this host. proxmoxmain is a secondary
# that shuts itself down after 3 min on battery (its own upssched); this host
# rides on until LOWBATT, then sets FSD, powers off and kills UPS power.
MONITOR atlantis@localhost 1 upsmon-primary <NUT_PRIMARY_PASSWORD> primary
MINSUPPLIES 1
SHUTDOWNCMD "/sbin/shutdown -h +0"
NOTIFYCMD /usr/sbin/upssched
POLLFREQ 5
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 25
POWERDOWNFLAG "/etc/killpower"
FINALDELAY 5
RBWARNTIME 43200
NOCOMMWARNTIME 300

NOTIFYFLAG ONLINE   SYSLOG+WALL+EXEC
NOTIFYFLAG ONBATT   SYSLOG+WALL+EXEC
NOTIFYFLAG LOWBATT  SYSLOG+WALL
NOTIFYFLAG FSD      SYSLOG+WALL
NOTIFYFLAG COMMOK   SYSLOG
NOTIFYFLAG COMMBAD  SYSLOG
NOTIFYFLAG SHUTDOWN SYSLOG+WALL
NOTIFYFLAG REPLBATT SYSLOG
NOTIFYFLAG NOCOMM   SYSLOG
