maxretry = 3

[atlantis]
  driver = usbhid-ups
  port = auto
  vendorid = 0764
  productid = 0601
  desc = "Atlantis A03-HP2003 (CyberPower OEM)"
  # CyberPower HID firmware drops off USB when polled with interrupt
  # transfers; poll-only avoids the "data stale" disconnects.
  pollonly
  pollinterval = 15
  # CPS firmware divides these by 60 and rounds down (usbhid-ups(8)); the
  # 20s/30s defaults would cut the outlets the instant killpower is sent.
  offdelay = 60
  ondelay = 120
