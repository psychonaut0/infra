services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    command: --http-enabled --base-url /
    ports:
      - "9000:9000"
      - "9443:9443"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data

  dashboard:
    build: ./dashboard-src
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./dashboard-src/.env

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - /var/www/infra-bin:/srv/infra-bin:ro

  gatus:
    image: twinproduction/gatus:v5.35.0
    container_name: gatus
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./gatus/.env
    volumes:
      - ./gatus/config.yaml:/config/config.yaml:ro

volumes:
  portainer-data:
  caddy-data:
  caddy-config:
