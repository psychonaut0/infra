# Gatus monitoring config
# Telegram credentials loaded from .env via ${VAR} substitution

alerting:
  telegram:
    token: "${TELEGRAM_TOKEN}"
    id: "${TELEGRAM_CHAT_ID}"
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

# --- Tier 1: Critical (30s, alert after 2 failures) ---

endpoints:
  - name: Home Assistant
    group: critical
    url: "http://192.168.3.10:8123"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Frigate
    group: critical
    url: "http://192.168.3.7:5000"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Immich
    group: critical
    url: "http://192.168.3.9:2283"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Jellyfin
    group: critical
    url: "http://192.168.3.8:8096"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram
        failure-threshold: 2
        success-threshold: 2
