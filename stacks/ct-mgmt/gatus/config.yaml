# Gatus monitoring config
# Telegram credentials loaded from .env via ${VAR} substitution

alerting:
  telegram:
    token: "${TELEGRAM_TOKEN}"
    id: "${TELEGRAM_CHAT_ID}"
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

# --- Tier 1: Critical (30s, alert after 2 failures) ---

endpoints:
  - name: Home Assistant
    group: critical
    url: "http://192.168.3.10:8123"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Frigate
    group: critical
    url: "http://192.168.3.7:5000"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Immich
    group: critical
    url: "http://192.168.3.9:2283"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Jellyfin
    group: critical
    url: "http://192.168.3.8:8096"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Caddy
    group: critical
    url: "http://caddy:80"
    interval: 30s
    headers:
      Host: home.lan
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  # --- Tier 2: Important (60s, alert after 3 failures) ---

  - name: Portainer
    group: important
    url: "http://portainer:9000"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram

  - name: Proxmox Main
    group: important
    url: "https://192.168.3.2:8006"
    interval: 60s
    client:
      insecure: true
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram

  - name: Proxmox Node
    group: important
    url: "https://192.168.3.3:8006"
    interval: 60s
    client:
      insecure: true
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram

  - name: Pi-hole
    group: important
    url: "http://192.168.3.5/admin/"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram

  # copyparty returns 200 with "howdy stranger (you're not logged in)" for an
  # unauthenticated request — not 401. So [STATUS] alone proves nothing: it
  # would still pass if the ACL broke and the webroot became publicly listable.
  # The body match is what asserts auth is actually being enforced.
  - name: Drive (psy)
    group: important
    url: "http://192.168.3.11:3923"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - "[BODY] == pat(*not logged in*)"
    alerts:
      - type: telegram

  - name: Drive (family)
    group: important
    url: "http://192.168.3.11:3924"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - "[BODY] == pat(*not logged in*)"
    alerts:
      - type: telegram

  - name: ESPHome
    group: important
    url: "http://192.168.3.15:6052"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram

  - name: Mosquitto
    group: important
    url: "tcp://192.168.3.10:1883"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: telegram

  - name: MC Vanilla
    group: important
    url: "tcp://192.168.3.14:25565"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: telegram

  - name: MC Modded
    group: important
    url: "tcp://192.168.3.14:25566"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: telegram

  - name: Workout API
    group: important
    url: "http://192.168.3.17:8080/healthz"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram

  - name: Workout PowerSync
    group: important
    url: "http://192.168.3.17:8090/probes/liveness"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  - name: Backup freshness
    group: important
    url: "http://backup.lan/status.json"
    interval: 15m
    # Staleness is enforced server-side by ct-backup's staleness-check.timer:
    # if the last successful backup is older than 36h, status.json's
    # `timestamp` is cleared and `stale: true` is set. Both conditions
    # below catch that, plus a missing/malformed status.json.
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - "[BODY].timestamp != \"\""
      - "[BODY].timestamp_unix > 0"
    alerts:
      - type: telegram

  # --- Tier 3: Background (120s, alert after 3 failures) ---

  - name: Sonarr
    group: background
    url: "http://192.168.3.8:8989"
    interval: 120s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram

  - name: Radarr
    group: background
    url: "http://192.168.3.8:7878"
    interval: 120s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram

  - name: Deluge
    group: background
    url: "http://192.168.3.8:8112"
    interval: 120s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram

  - name: Prowlarr
    group: background
    url: "http://192.168.3.8:9696"
    interval: 120s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram

  - name: FlareSolverr
    group: background
    url: "http://192.168.3.8:8191"
    interval: 120s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram

  - name: Portfolio (LAN)
    group: background
    url: "http://192.168.3.16:3000/"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
    alerts:
      - type: telegram
        failure-threshold: 5
        success-threshold: 2
        send-on-resolved: true

  - name: Portfolio (public)
    group: background
    url: "https://portfolio.${PERSONAL_DOMAIN}/"
    interval: 5m
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: telegram
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
