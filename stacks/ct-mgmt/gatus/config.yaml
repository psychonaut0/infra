  # --- Tier 2: Important (60s, alert after 3 failures) ---

  - name: Portainer
    group: important
    url: "http://portainer:9000"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram

  - name: Proxmox Main
    group: important
    url: "https://192.168.3.2:8006"
    interval: 60s
    client:
      insecure: true
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram

  - name: Proxmox Node
    group: important
    url: "https://192.168.3.3:8006"
    interval: 60s
    client:
      insecure: true
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram

  - name: Pi-hole
    group: important
    url: "http://192.168.3.5/admin/"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram

  # copyparty returns 200 with "howdy stranger (you're not logged in)" for an
  # unauthenticated request — not 401. So [STATUS] alone proves nothing: it
  # would still pass if the ACL broke and the webroot became publicly listable.
  # The body match is what asserts auth is actually being enforced.
  - name: Drive (psy)
    group: important
    url: "http://192.168.3.11:3923"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - "[BODY] == pat(*not logged in*)"
    alerts:
      - type: telegram

  - name: Drive (family)
    group: important
    url: "http://192.168.3.11:3924"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - "[BODY] == pat(*not logged in*)"
    alerts:
      - type: telegram

  - name: ESPHome
    group: important
    url: "http://192.168.3.15:6052"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram

  - name: Mosquitto
    group: important
    url: "tcp://192.168.3.10:1883"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: telegram

  - name: MC Vanilla
    group: important
    url: "tcp://192.168.3.14:25565"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: telegram

  - name: MC Modded
    group: important
    url: "tcp://192.168.3.14:25566"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: telegram

  - name: Workout API
    group: important
    url: "http://192.168.3.17:8080/healthz"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: telegram

  - name: Workout PowerSync
    group: important
    url: "http://192.168.3.17:8090/probes/liveness"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  # Separate dimensions: healthz is process/route liveness, not an owner read.
  - name: Animus API liveness
    group: important
    url: "http://hub.lan/healthz"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
    alerts: &animus-alerts
      - type: telegram

  - name: Animus canonical provider discovery
    group: important
    url: "http://auth.lan/application/o/alkion-lan/.well-known/openid-configuration"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - "[BODY].issuer == \"http://auth.lan/application/o/alkion-lan/\""
    alerts: *animus-alerts

  - name: Animus collection freshness
    group: important
    url: "http://backup.lan/animus-operations.json"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].observed == true"
    alerts: *animus-alerts

  - name: Animus database health
    group: important
    url: "http://backup.lan/animus-operations.json"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].database_ready == true"
    alerts: *animus-alerts

  - name: Animus provider service health
    group: important
    url: "http://backup.lan/animus-operations.json"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].provider_ready == true"
    alerts: *animus-alerts

  - name: Animus recovery authority
    group: important
    url: "http://backup.lan/animus-operations.json"
    interval: 1m
    # recovery_closed is a separate informational bit. A matching intentionally
    # closed generation is valid authority; it cannot satisfy the owner-read bit.
    conditions:
      - "[STATUS] == 200"
      - "[BODY].control_ready == true"
    alerts: *animus-alerts

  - name: Animus storage headroom
    group: important
    url: "http://backup.lan/animus-operations.json"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].source_storage_ok == true"
      - "[BODY].receiver_storage_ok == true"
    alerts: *animus-alerts

  - name: Animus recent authenticated read
    group: important
    url: "http://backup.lan/animus-operations.json"
    interval: 1m
    # Owner renews a bounded actual read <=24h. No continuous login/refresh claim.
    conditions:
      - "[STATUS] == 200"
      - "[BODY].authenticated_read_recent == true"
    alerts: *animus-alerts

  - name: Animus coherent offhost protection
    group: important
    url: "http://backup.lan/animus.json"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].protected == true"
      - "[BODY].timestamp_unix > 0"
    alerts: *animus-alerts

  - name: Backup freshness
    group: important
    url: "http://backup.lan/status.json"
    interval: 15m
    # Staleness is enforced server-side by ct-backup's staleness-check.timer:
    # if the last successful backup is older than 36h, status.json's
    # `timestamp` is cleared and `stale: true` is set. Both conditions
    # below catch that, plus a missing/malformed status.json.
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - "[BODY].timestamp != \"\""
      - "[BODY].timestamp_unix > 0"
    alerts:
      - type: telegram

  - name: Open WebUI (LAN)
    group: important
    # /health is intentionally unauthenticated in Open WebUI, so this is a pure
    # liveness probe. The public hostname gets its own check asserting that
    # Cloudflare Access is *enforcing* — see that entry for why it must not
    # assert 200.
    url: "http://192.168.3.18:8080/health"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
    alerts:
      - type: telegram
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true

  - name: Open WebUI (public, Access enforced)
    group: important
    # Asserts 302 ON PURPOSE, not < 400. Cloudflare Access redirects every
    # unauthenticated request — including /health — to the Access login page.
    # A 200 here would mean Access has STOPPED enforcing and the app is bare on
    # the internet in front of a paid API key, so 200 must fail this check
    # rather than pass it. Verified enforced code on 2026-07-31: 302 to
    # <team>.cloudflareaccess.com/cdn-cgi/access/login/chat.<domain>.
    url: "https://chat.${PERSONAL_DOMAIN}/health"
    interval: 5m
    client:
      # Load-bearing. Gatus follows redirects by default, so it would chase the
      # 302 to the Access login page and report that page's 200 — making a
      # [STATUS] == 200 assertion pass for the wrong reason and hiding a real
      # Access failure. Without this, the check cannot see the 302 at all.
      ignore-redirect: true
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 302"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: telegram
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true

  # --- Tier 3: Background (120s, alert after 3 failures) ---

  - name: Sonarr
