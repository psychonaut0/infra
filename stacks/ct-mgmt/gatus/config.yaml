  - name: Portfolio (LAN)
    group: background
    url: "http://192.168.3.16:3000/"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
    alerts:
      - type: telegram
        failure-threshold: 5
        success-threshold: 2
