mqtt:
  enabled: true
  host: 192.168.3.10
  port: 1883
  topic_prefix: frigate
  client_id: frigate
  user: homeassistant
  password: "{FRIGATE_MQTT_PASSWORD}"

detectors:
  # CPU, not GPU: the Intel iGPU is disabled in the BIOS since the GTX 1650
  # Super went in (2026-09-26), and OpenVINO cannot target an NVIDIA card.
  # Interim — GPU detection needs the onnx detector plus an exported YOLO model.
  ov:
    type: openvino
    device: CPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

ffmpeg:
  hwaccel_args: preset-nvidia

objects:
  track:
    - person

detect:
  fps: 5

live:
  height: 1520
  quality: 10

record:
  enabled: true
  # Continuous 24/7 recording for 3 days, then only person events for 30.
  # Recordings are downscaled to 1080p by the go2rtc NVENC transcode streams
  # below (cameras expose no substream). ~44GB/day continuous; only 2-6% of
  # footage contains a person, so 30 days of events costs ~1-2GB/day.
  # History: 7 days filled the 393GB volume to 93% and left the thin volume
  # 99.98% allocated, which thrashed ct-nvr's 6GiB memcg on page cache and
  # wedged the CT (2026-08-26, see docs/hardware.md). That cut to 4 days was
  # made here but never reached the live file; tiered retention replaced it
  # on 2026-09-26.
  continuous:
    days: 3
  # Review items (the timeline "checks") keep their motion segments for 30 days.
  alerts:
    retain:
      days: 30
      mode: motion
  detections:
    retain:
      days: 30
      mode: motion

snapshots:
  enabled: true
  clean_copy: true
  timestamp: true
  bounding_box: true
  crop: false
  retain:
    default: 200
    objects:
      person: 360

go2rtc:
  webrtc:
    candidates:
      - 192.168.3.7:8555
  rtsp:
    username: viewer
    password: "{FRIGATE_RESTREAM_PASSWORD}"
  streams:
    camera_1:
      - rtsp://frigate:{FRIGATE_RTSP_PASSWORD}@192.168.2.10:554
      - "ffmpeg:camera_1#audio=opus"
    # Downscaled record feed: GPU (NVIDIA NVDEC) decode -> scale to 1080p -> H264 (NVENC).
    # Sources the local restream (no extra camera connection). Used by the
    # camera's "record" role so 24/7 footage is ~1.5Mbps instead of full 2688x1520.
    camera_1_record:
      - "exec:/usr/lib/ffmpeg/7.0/bin/ffmpeg -hide_banner -loglevel warning -hwaccel cuda -hwaccel_output_format cuda -rtsp_transport tcp -i rtsp://127.0.0.1:8554/camera_1 -an -vf scale_cuda=1920:1080 -c:v h264_nvenc -b:v 1.5M -g 50 -rtsp_transport tcp -f rtsp {{output}}"
    camera_2:
      - rtsp://frigate:{FRIGATE_RTSP_PASSWORD}@192.168.2.11:554
      - "ffmpeg:camera_2#audio=opus"
    camera_2_record:
      - "exec:/usr/lib/ffmpeg/7.0/bin/ffmpeg -hide_banner -loglevel warning -hwaccel cuda -hwaccel_output_format cuda -rtsp_transport tcp -i rtsp://127.0.0.1:8554/camera_2 -an -vf scale_cuda=1920:1080 -c:v h264_nvenc -b:v 1.5M -g 50 -rtsp_transport tcp -f rtsp {{output}}"
    camera_3:
      - rtsp://frigate:{FRIGATE_RTSP_PASSWORD}@192.168.2.12:554
      - "ffmpeg:camera_3#audio=opus"
    camera_3_record:
      - "exec:/usr/lib/ffmpeg/7.0/bin/ffmpeg -hide_banner -loglevel warning -hwaccel cuda -hwaccel_output_format cuda -rtsp_transport tcp -i rtsp://127.0.0.1:8554/camera_3 -an -vf scale_cuda=1920:1080 -c:v h264_nvenc -b:v 1.5M -g 50 -rtsp_transport tcp -f rtsp {{output}}"

cameras:
  camera_1:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_1_record
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/camera_1
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      width: 640
      height: 360

  camera_2:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_2_record
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/camera_2
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      width: 640
      height: 360

  camera_3:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_3_record
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/camera_3
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      width: 640
      height: 360

version: 0.17-0
