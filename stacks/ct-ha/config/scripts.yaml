household_apply_camera_policy:
  alias: Casa · verifica videocamere
  mode: restart
  sequence:
  - if:
    - condition: template
      value_template: '{{ states(''input_select.household_presence'') not in [''In casa'',''Fuori casa''] and
        not is_state(''input_boolean.household_guests'',''on'') }}'
    then:
    - variables:
        result:
          ok: false
          detail: 'Presenza non impostata: videocamere lasciate come sono.'
    - stop: 'Presenza non impostata: videocamere lasciate come sono.'
      response_variable: result
  - variables:
      cameras_wanted: '{{ (is_state(''input_select.household_presence'',''Fuori casa'') and is_state(''input_boolean.household_guests'',''off''))
        or (is_state(''input_boolean.household_night'',''on'') and (is_state(''input_select.household_presence'',''In
        casa'') or is_state(''input_boolean.household_guests'',''on''))) }}'
      requested_at: '{{ as_timestamp(now()) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ cameras_wanted }}'
      sequence:
      - variables:
          power_ok: false
      # UniFi reports the switch as stale for ~1 min after a port change; retry before giving up.
      - repeat:
          sequence:
          - if:
            - condition: template
              value_template: '{{ repeat.index > 1 }}'
            then:
            - delay: 00:00:20
          - action: shell_command.household_camera_power_on
            response_variable: power_result
            continue_on_error: true
          - variables:
              power_ok: '{{ power_result is defined and power_result.returncode == 0 }}'
          until:
          - condition: template
            value_template: '{{ power_ok or repeat.index >= 4 }}'
      - if:
        - condition: template
          value_template: '{{ not power_ok }}'
        then:
        - action: persistent_notification.create
          data:
            notification_id: household_camera_control
            title: Problema alle videocamere
            message: Le videocamere non si sono accese.
        - variables:
            result:
              ok: false
              detail: Le videocamere non si sono accese.
        - stop: Le videocamere non si sono accese.
          response_variable: result
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.camera_power
        continue_on_error: true
      - wait_template: '{{ is_state(''sensor.camera_power'',''ok'') and (as_timestamp(now()) - (state_attr(''sensor.camera_power'',''checked_at'')
          | float(0))) < 90 and state_attr(''sensor.camera_power'',''checked_at'') | float(0) >= requested_at
          and state_attr(''sensor.camera_power'',''ready'') == true }}'
        timeout: 00:03:00
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ not wait.completed }}'
        then:
        - action: persistent_notification.create
          data:
            notification_id: household_camera_control
            title: Problema alle videocamere
            message: Una videocamera non risponde.
        - variables:
            result:
              ok: false
              detail: Una videocamera non risponde.
        - stop: Una videocamera non risponde.
          response_variable: result
      - if:
        - condition: template
          value_template: '{{ cameras_wanted != ((is_state(''input_select.household_presence'',''Fuori casa'')
            and is_state(''input_boolean.household_guests'',''off'')) or (is_state(''input_boolean.household_night'',''on'')
            and (is_state(''input_select.household_presence'',''In casa'') or is_state(''input_boolean.household_guests'',''on''))))
            }}'
        then:
        - variables:
            result:
              ok: false
              detail: 'Accensione annullata: è partita un’altra routine.'
        - stop: 'Accensione annullata: è partita un’altra routine.'
          response_variable: result
      - action: camera.turn_on
        target:
          entity_id:
          - camera.cam_soggiorno
          - camera.camera_2
          - camera.camera_3
        continue_on_error: true
      - action: switch.turn_on
        target:
          entity_id:
          - switch.camera_1_recordings
          - switch.camera_2_recordings
          - switch.camera_3_recordings
        continue_on_error: true
      - wait_template: '{{ is_state(''sensor.camera_power'',''ok'') and (as_timestamp(now()) - (state_attr(''sensor.camera_power'',''checked_at'')
          | float(0))) < 90 and state_attr(''sensor.camera_power'',''ready'') == true and [''camera.cam_soggiorno'',
          ''camera.camera_2'', ''camera.camera_3''] | select(''is_state'',''recording'') | list | count ==
          3 and [''switch.camera_1_recordings'', ''switch.camera_2_recordings'', ''switch.camera_3_recordings'']
          | select(''is_state'',''on'') | list | count == 3 and states(''sensor.camera_1_camera_fps'') | float(0)
          > 0 and states(''sensor.camera_2_camera_fps'') | float(0) > 0 and states(''sensor.camera_3_camera_fps'')
          | float(0) > 0 and (as_timestamp(now()) - as_timestamp(states.sensor.camera_1_camera_fps.last_reported,0))
          < 90 and (as_timestamp(now()) - as_timestamp(states.sensor.camera_2_camera_fps.last_reported,0))
          < 90 and (as_timestamp(now()) - as_timestamp(states.sensor.camera_3_camera_fps.last_reported,0))
          < 90 and as_timestamp(states.sensor.camera_1_camera_fps.last_reported,0) >= requested_at and as_timestamp(states.sensor.camera_2_camera_fps.last_reported,0)
          >= requested_at and as_timestamp(states.sensor.camera_3_camera_fps.last_reported,0) >= requested_at
          }}'
        timeout: 00:02:00
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ not wait.completed }}'
        then:
        - action: persistent_notification.create
          data:
            notification_id: household_camera_control
            title: Problema alle videocamere
            message: Le videocamere sono accese ma non tutte registrano.
        - variables:
            result:
              ok: false
              detail: Le videocamere sono accese ma non tutte registrano.
        - stop: Le videocamere sono accese ma non tutte registrano.
          response_variable: result
      - action: persistent_notification.dismiss
        data:
          notification_id: household_camera_control
      - variables:
          result:
            ok: true
            detail: Accese e in registrazione.
      - stop: Accese e in registrazione.
        response_variable: result
    default:
    - action: camera.turn_off
      target:
        entity_id:
        - camera.cam_soggiorno
        - camera.camera_2
        - camera.camera_3
      continue_on_error: true
    - variables:
        power_ok: false
    # UniFi reports the switch as stale for ~1 min after a port change; retry before giving up.
    - repeat:
        sequence:
        - if:
          - condition: template
            value_template: '{{ repeat.index > 1 }}'
          then:
          - delay: 00:00:20
        - action: shell_command.household_camera_power_off
          response_variable: power_result
          continue_on_error: true
        - variables:
            power_ok: '{{ power_result is defined and power_result.returncode == 0 }}'
        until:
        - condition: template
          value_template: '{{ power_ok or repeat.index >= 4 }}'
    - if:
      - condition: template
        value_template: '{{ not power_ok }}'
      then:
      - action: persistent_notification.create
        data:
          notification_id: household_camera_control
          title: Problema alle videocamere
          message: Le videocamere non si sono spente.
      - variables:
          result:
            ok: false
            detail: Le videocamere non si sono spente.
      - stop: Le videocamere non si sono spente.
        response_variable: result
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.camera_power
      continue_on_error: true
    - wait_template: '{{ is_state(''sensor.camera_power'',''ok'') and (as_timestamp(now()) - (state_attr(''sensor.camera_power'',''checked_at'')
        | float(0))) < 90 and state_attr(''sensor.camera_power'',''checked_at'') | float(0) >= requested_at
        and state_attr(''sensor.camera_power'',''privacy_verified'') == true }}'
      timeout: 00:03:00
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ not wait.completed }}'
      then:
      - action: persistent_notification.create
        data:
          notification_id: household_camera_control
          title: Problema alle videocamere
          message: Non tutte le videocamere risultano spente.
      - variables:
          result:
            ok: false
            detail: Non tutte le videocamere risultano spente.
      - stop: Non tutte le videocamere risultano spente.
        response_variable: result
    - action: persistent_notification.dismiss
      data:
        notification_id: household_camera_control
    - variables:
        result:
          ok: true
          detail: 'Spente e scollegate.'
    - stop: 'Spente e scollegate.'
      response_variable: result
household_position_shutters:
  alias: Casa · posiziona e verifica tapparelle
  mode: restart
  fields:
    routine:
      required: true
      selector:
        select:
          options:
          - night
          - morning
  sequence:
  - if:
    - condition: template
      value_template: '{{ routine | default('''') not in [''night'',''morning''] }}'
    then:
    - variables:
        result:
          ok: false
          detail: Routine tapparelle non valida.
    - stop: Routine tapparelle non valida.
      response_variable: result
  - variables:
      enabled: '{{ is_state(''input_boolean.household_shutters_enabled'' if routine == ''night'' else ''input_boolean.household_morning_shutters'',''on'')
        }}'
      targets: '{{ [{''entity'': ''cover.shellyplus2pm_8813bfd0a3b8'', ''name'': ''Studio'', ''target'': ''input_number.night_shutter_office''},
        {''entity'': ''cover.shellyplus2pm_8813bfd0b9ec'', ''name'': ''Camera matrimoniale'', ''target'': ''input_number.night_shutter_master''},
        {''entity'': ''cover.shellyplus2pm_8813bfd4933c'', ''name'': ''Camera Francesco sinistra'', ''target'':
        ''input_number.night_shutter_guest_left''}, {''entity'': ''cover.shellyplus2pm_2cbcbb2d92d8'', ''name'':
        ''Camera Francesco destra'', ''target'': ''input_number.night_shutter_guest_right''}, {''entity'':
        ''cover.shellyplus2pm_78ee4ccf104c'', ''name'': ''Cucina'', ''target'': ''input_number.night_shutter_kitchen''}]
        if routine == ''night'' else [{''entity'': ''cover.shellyplus2pm_8813bfd0a3b8'', ''name'': ''Studio'',
        ''target'': ''input_number.morning_shutter_position''}, {''entity'': ''cover.shellyplus2pm_8813bfd0b9ec'',
        ''name'': ''Camera matrimoniale'', ''target'': ''input_number.morning_shutter_position''}, {''entity'':
        ''cover.shellyplus2pm_78ee4ccf104c'', ''name'': ''Cucina'', ''target'': ''input_number.morning_shutter_position''}]
        }}'
  - if:
    - condition: template
      value_template: '{{ not enabled }}'
    then:
    - variables:
        result:
          ok: true
          detail: Tapparelle disattivate nelle impostazioni.
    - stop: Tapparelle disattivate nelle impostazioni.
      response_variable: result
  - repeat:
      for_each: '{{ targets }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ has_value(repeat.item.entity) and is_number(states(repeat.item.target)) and 0
            <= states(repeat.item.target) | float(-1) <= 100 and is_number(state_attr(repeat.item.entity,''current_position''))
            and state_attr(repeat.item.entity,''supported_features'') | int(0) | bitwise_and(4) > 0 }}'
        then:
        - if:
          - condition: template
            value_template: '{{ (state_attr(repeat.item.entity,''current_position'') | float - states(repeat.item.target)
              | float) | abs > 2 or states(repeat.item.entity) in [''opening'',''closing''] }}'
          then:
          - action: cover.set_cover_position
            target:
              entity_id: '{{ repeat.item.entity }}'
            data:
              position: '{{ states(repeat.item.target) | int }}'
            continue_on_error: true
  - wait_template: "{% set ns = namespace(ok=true) %}\n{% for item in targets %}\n  {% set position = state_attr(item.entity,'current_position')\
      \ %}\n  {% set desired = states(item.target) %}\n  {% if not has_value(item.entity) or not is_number(position)\
      \ or not is_number(desired) or not 0 <= desired | float(-1) <= 100 or (position | float(-999) - desired\
      \ | float(-999)) | abs > 2 or states(item.entity) in ['opening','closing'] %}\n    {% set ns.ok = false\
      \ %}\n  {% endif %}\n{% endfor %}\n{{ ns.ok }}"
    timeout: 00:01:30
    continue_on_timeout: true
  - variables:
      failed_shutters: "{% set ns = namespace(names=[]) %}\n{% for item in targets %}\n  {% set position =\
        \ state_attr(item.entity,'current_position') %}\n  {% set desired = states(item.target) %}\n  {% if\
        \ not has_value(item.entity) or not is_number(position) or not is_number(desired) or not 0 <= desired\
        \ | float(-1) <= 100 or (position | float(-999) - desired | float(-999)) | abs > 2 or states(item.entity)\
        \ in ['opening','closing'] %}\n    {% set ns.names = ns.names + [item.name] %}\n  {% endif %}\n{% endfor\
        \ %}\n{{ ns.names }}"
  - if:
    - condition: template
      value_template: '{{ failed_shutters | count > 0 }}'
    then:
    - variables:
        result:
          ok: false
          detail: 'Tapparelle non arrivate in posizione: {{ failed_shutters | join(", ") }}.'
    - stop: 'Tapparelle non arrivate in posizione: {{ failed_shutters | join(", ") }}.'
      response_variable: result
  - variables:
      result:
        ok: true
        detail: 'In posizione: {{ targets | count }} tapparelle.'
  - stop: 'In posizione: {{ targets | count }} tapparelle.'
    response_variable: result
household_run_routine:
  alias: Casa · esegui routine
  description: Esegue e verifica le azioni. Una nuova richiesta sostituisce la precedente.
  mode: restart
  fields:
    routine:
      required: true
      selector:
        select:
          options:
          - night
          - morning
          - leaving
          - arriving
  sequence:
  - if:
    - condition: template
      value_template: '{{ routine | default('''') not in [''night'',''morning'',''leaving'',''arriving''] }}'
    then:
    - stop: Routine non valida.
      error: true
  - action: script.turn_off
    target:
      entity_id:
      - script.household_apply_camera_policy
      - script.household_position_shutters
  - variables:
      routine_name: '{{ {''night'':''Buonanotte'',''morning'':''Buongiorno'',''leaving'':''Usciamo'',''arriving'':''Rientro''}[routine]
        }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.household_routine_name
    data:
      value: '{{ routine_name }}'
  - action: input_select.select_option
    target:
      entity_id: input_select.household_routine_status
    data:
      option: In corso
  - action: input_text.set_value
    target:
      entity_id: input_text.household_routine_step
    data:
      value: Preparazione della casa…
  - action: input_text.set_value
    target:
      entity_id: input_text.household_routine_cameras
    data:
      value: '{{ camera_result.get(''detail'',''Controllo delle videocamere interrotto.'') if camera_result is defined
        and camera_result is mapping else ''Controllo delle videocamere interrotto.'' }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.household_routine_shutters
    data:
      value: In attesa
  - action: input_text.set_value
    target:
      entity_id: input_text.household_routine_result
    data:
      value: Verifica in corso.
  - if:
    - condition: template
      value_template: '{{ routine == ''leaving'' and is_state(''input_boolean.household_guests'',''on'') }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.household_routine_cameras
      data:
        value: 'La casa resta occupata: nessun comando.'
    - action: input_text.set_value
      target:
        entity_id: input_text.household_routine_shutters
      data:
        value: Non previste.
    - action: input_text.set_value
      target:
        entity_id: input_text.household_routine_step
      data:
        value: Ospiti ancora in casa
    - action: input_text.set_value
      target:
        entity_id: input_text.household_routine_result
      data:
        value: 'Ci sono ospiti in casa: le videocamere restano spente.'
    - action: input_select.select_option
      target:
        entity_id: input_select.household_routine_status
      data:
        option: Da controllare
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.household_routine_finished
      data:
        timestamp: '{{ as_timestamp(now()) }}'
    - stop: Ospiti presenti.
  - action: input_boolean.turn_{{ 'on' if routine == 'night' else 'off' }}
    target:
      entity_id: input_boolean.household_night
  - action: input_select.select_option
    target:
      entity_id: input_select.household_presence
    data:
      option: '{{ ''Fuori casa'' if routine == ''leaving'' else ''In casa'' }}'
  - if:
    - condition: template
      value_template: '{{ routine in [''morning'',''arriving''] }}'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.household_long_absence
  - action: persistent_notification.dismiss
    data:
      notification_id: household_bedtime
  - action: persistent_notification.dismiss
    data:
      notification_id: household_wakeup
  - variables:
      camera_result:
        ok: false
        detail: Controllo delle videocamere interrotto.
      shutter_result: '{{ {''ok'': false, ''detail'': ''Controllo delle tapparelle interrotto.''} if routine in [''night'',''morning'']
        else {''ok'': true, ''detail'': ''Non previste.''} }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.household_routine_step
    data:
      value: Verifica videocamere e tapparelle…
  - action: input_text.set_value
    target:
      entity_id: input_text.household_routine_cameras
    data:
      value: '{{ ''Accensione…'' if routine in [''night'',''leaving''] else ''Spegnimento…'' }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.household_routine_shutters
    data:
      value: '{{ ''In movimento…'' if routine in [''night'',''morning''] else ''Non previste.'' }}'
  - parallel:
    - sequence:
      - action: script.household_apply_camera_policy
        response_variable: camera_result
        continue_on_error: true
      - action: input_text.set_value
        target:
          entity_id: input_text.household_routine_cameras
        data:
          value: '{{ camera_result.get(''detail'',''Controllo delle videocamere interrotto.'') if camera_result is
            defined and camera_result is mapping else ''Controllo delle videocamere interrotto.'' }}'
    - sequence:
      - if:
        - condition: template
          value_template: '{{ routine in [''night'',''morning''] }}'
        then:
        - action: script.household_position_shutters
          data:
            routine: '{{ routine }}'
          response_variable: shutter_result
          continue_on_error: true
      - action: input_text.set_value
        target:
          entity_id: input_text.household_routine_shutters
        data:
          value: '{{ shutter_result.get(''detail'',''Controllo delle tapparelle interrotto.'') if shutter_result
            is mapping else ''Controllo delle tapparelle interrotto.'' }}'
  - variables:
      camera_ok: '{{ camera_result is mapping and camera_result.get(''ok'',false) }}'
  - variables:
      routine_ok: '{{ camera_ok and shutter_result is mapping and shutter_result.get(''ok'',false) }}'
      openings_ok: '{{ is_state(''sensor.household_open_windows'',''0'') and is_state(''binary_sensor.front_door_door'',''off'')
        }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.household_routine_step
    data:
      value: '{{ ''Azioni completate'' if routine_ok else ''Alcune azioni richiedono un controllo'' }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.household_routine_result
    data:
      value: '{% set p = [] %}{% if not camera_ok %}{% set p = p + [camera_result.get(''detail'',''Controllo delle videocamere interrotto.'') if camera_result is mapping else ''Controllo delle videocamere interrotto.''] %}{% endif %}{% if not (shutter_result is mapping and shutter_result.get(''ok'',false)) %}{% set p = p + [shutter_result.get(''detail'',''Controllo delle tapparelle interrotto.'') if shutter_result is mapping else ''Controllo delle tapparelle interrotto.''] %}{% endif %}{% if not openings_ok %}{% set p = p + [''C’è una porta o una finestra aperta.''] %}{% endif %}{{ (p | join('' ''))[:255] if p else ''Tutto fatto.'' }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.household_routine_finished
    data:
      timestamp: '{{ as_timestamp(now()) }}'
  - action: input_select.select_option
    target:
      entity_id: input_select.household_routine_status
    data:
      option: '{{ ''Completata'' if routine_ok and openings_ok else ''Da controllare'' }}'
  - action: logbook.log
    data:
      name: Routine casa
      message: '{{ routine_name }}: {{ states(''input_select.household_routine_status'') }}. {{ states(''input_text.household_routine_cameras'')
        }} {{ states(''input_text.household_routine_shutters'') }}'
      entity_id: input_select.household_routine_status
household_good_night:
  alias: Buonanotte
  icon: mdi:weather-night
  mode: restart
  sequence:
  - action: script.household_run_routine
    data:
      routine: night
household_good_morning:
  alias: Buongiorno
  icon: mdi:weather-sunset-up
  mode: restart
  sequence:
  - action: script.household_run_routine
    data:
      routine: morning
household_leaving:
  alias: Usciamo
  icon: mdi:home-export-outline
  mode: restart
  sequence:
  - action: script.household_run_routine
    data:
      routine: leaving
household_arriving:
  alias: Rientro
  icon: mdi:home-import-outline
  mode: restart
  sequence:
  - action: script.household_run_routine
    data:
      routine: arriving
room_quick_lights:
  alias: Stanza · luci rapide
  description: Dashboard quick control. Any light on in the room turns them all off; otherwise turns on the room's main light.
  icon: mdi:lightbulb-auto-outline
  mode: parallel
  max: 10
  fields:
    lights:
      name: Luci della stanza
      required: true
      selector:
        entity:
          domain: light
          multiple: true
    main:
      name: Luce principale
      required: true
      selector:
        entity:
          domain: light
          multiple: true
  sequence:
  - if:
    - condition: template
      value_template: '{{ lights | select(''is_state'', ''on'') | list | count > 0 }}'
    then:
    - action: light.turn_off
      target:
        entity_id: '{{ lights }}'
    else:
    - action: light.turn_on
      target:
        entity_id: '{{ main }}'
