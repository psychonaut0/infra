# Family dashboard (/casa-famiglia/casa) — the system default for every user.
# One fullscreen panel view: status hero, shortcut chips, routine buttons and room tiles fill
# exactly one screen with no page scroll (the rooms grid takes the height left over); rooms,
# Clima, Tapparelle, Sicurezza and Consumi open as Bubble Card pop-ups (#hash links).
# On phones (≤600px) kiosk-mode hides the header; long-press the status card to open the
# profile page, whose header has the sidebar menu button.
# Needs these HACS frontend cards (Lovelace resources live in HA storage, not here):
# Mushroom, Bubble Card, Advanced Camera Card, apexcharts-card, auto-entities, card-mod
# (layout via custom:mod-card + card_mod styles), kiosk-mode, button-card.
# Room tiles are custom:button-card using the shared `casa_room` template below: each room only
# lists its lights, windows and thermostat (variables) plus its actions. Icon tap runs
# script.room_quick_lights (scripts.yaml); the rest of the tile opens the room pop-up.
title: Casa
button_card_templates:
  casa_room:
    show_icon: true
    show_name: true
    show_state: false
    show_label: false
    hold_action:
      action: none
    variables:
      lights: []
      windows: []
      climate: ''
      door: false
    custom_fields:
      status: '[[[ const on = (variables.lights || []).filter(e => states[e] && states[e].state === ''on'').length;const ws
        = (variables.windows || []).map(e => states[e] ? states[e].state : '''');const open = ws.filter(s => s === ''Aperta'').length,
        tilt = ws.filter(s => s === ''A ribalta'').length;let a = open + tilt > 1 ? ''Finestre aperte'' : open ? ''Finestra
        aperta'' : tilt ? ''Finestra a ribalta'' : '''';if (variables.door && states[''binary_sensor.front_door_door''] &&
        states[''binary_sensor.front_door_door''].state === ''on'') a = a ? ''Porta aperta · '' + a : ''Porta aperta''; const
        c = states[variables.climate]; const t = c ? c.attributes.current_temperature : null; const tt = typeof t === ''number''
        ? t.toFixed(1).replace(''.'', '','') + ''°'' + (c.attributes.hvac_action === ''heating'' ? '' <ha-icon icon="mdi:fire"
        class="fire"></ha-icon>'' : '''') : ''''; const l = on ? on + (on === 1 ? '' luce accesa'' : '' luci accese'') : ''Luci
        spente''; if (a) return ''<span class="alert">'' + a + ''</span>'' + (tt || !on ? '''' : '' · '' + l) + (tt ? '' ·
        '' + tt : ''''); return on || !tt ? l + (tt ? '' · '' + tt : '''') : tt; ]]]'
    styles:
      card:
      - height: 100%
      - box-sizing: border-box
      - padding: 12px
      - background: '[[[ const on = (variables.lights || []).filter(e => states[e] && states[e].state === ''on'').length;
          return on ? ''rgba(var(--rgb-amber-color, 255, 193, 7), 0.16)'' : ''var(--ha-card-background, var(--card-background-color))'';
          ]]]'
      - border-color: '[[[ const on = (variables.lights || []).filter(e => states[e] && states[e].state === ''on'').length;
          return on ? ''rgba(var(--rgb-amber-color, 255, 193, 7), 0.6)'' : ''var(--ha-card-border-color, var(--divider-color))'';
          ]]]'
      grid:
      - grid-template-areas: '"i" "." "n" "status"'
      - grid-template-columns: minmax(0, 1fr)
      - grid-template-rows: auto 1fr auto auto
      - height: 100%
      img_cell:
      - position: relative
      - justify-self: start
      - width: var(--room-icon)
      - height: var(--room-icon)
      - border-radius: 50%
      - box-shadow: '[[[ const ws = (variables.windows || []).map(e => states[e] ? states[e].state : '''');const open = ws.filter(s
          => s === ''Aperta'').length, tilt = ws.filter(s => s === ''A ribalta'').length;let a = open + tilt > 1 ? ''Finestre
          aperte'' : open ? ''Finestra aperta'' : tilt ? ''Finestra a ribalta'' : '''';if (variables.door && states[''binary_sensor.front_door_door'']
          && states[''binary_sensor.front_door_door''].state === ''on'') a = a ? ''Porta aperta · '' + a : ''Porta aperta'';
          return a ? ''0 0 0 2px var(--orange-color, #ff9800)'' : ''none''; ]]]'
      - background: '[[[ const on = (variables.lights || []).filter(e => states[e] && states[e].state === ''on'').length;
          return on ? ''rgba(var(--rgb-amber-color, 255, 193, 7), 0.25)'' : ''rgba(var(--rgb-primary-text-color, 33, 33, 33),
          0.06)''; ]]]'
      icon:
      - width: 55%
      - color: '[[[ const on = (variables.lights || []).filter(e => states[e] && states[e].state === ''on'').length; return
          on ? ''var(--amber-color, #ffc107)'' : ''var(--disabled-text-color, #9e9e9e)''; ]]]'
      name:
      - justify-self: start
      - align-self: end
      - text-align: start
      - min-width: '0'
      - max-width: 100%
      - font-size: var(--room-name)
      - font-weight: '500'
      - line-height: '1.2'
      - white-space: normal
      - overflow: hidden
      - display: -webkit-box
      - -webkit-line-clamp: '2'
      - -webkit-box-orient: vertical
      custom_fields:
        status:
        - justify-self: start
        - text-align: start
        - font-size: var(--room-meta)
        - color: var(--secondary-text-color)
        - margin-top: 2px
        - min-width: '0'
        - max-width: 100%
        - white-space: normal
        - overflow: hidden
        - display: -webkit-box
        - -webkit-line-clamp: '2'
        - -webkit-box-orient: vertical
        - line-height: '1.3'
    extra_styles: |
      ha-card { container-type: size; }
      #container { --room-icon: clamp(30px, 40cqh, 52px); --room-name: clamp(15px, min(15cqh, 9cqw), 20px);
        --room-meta: clamp(12px, min(11.5cqh, 7cqw), 15px); }
      .alert { color: var(--orange-color, #ff9800); font-weight: 500; }
      .fire { --mdc-icon-size: 1.1em; color: var(--deep-orange-color, #ff5722); vertical-align: -0.15em; }
      /* Tight tiles keep the normal layout with one-line name and status. */
      @container (max-height: 90px) { #name, #status { display: block !important; white-space: nowrap !important;
        text-overflow: ellipsis; } }
      /* Only really short tiles (content < 62px) collapse to one row. */
      @container (max-height: 62px) {
        #container { grid-template-areas: "i n" "i status" !important; grid-template-columns: auto 1fr !important;
          grid-template-rows: 1fr 1fr !important; column-gap: 10px; }
        #name { align-self: end; -webkit-line-clamp: 1; }
        #status { align-self: start; margin-top: 0; }
        #img-cell { align-self: center; }
      }
views:
- title: Casa
  path: casa
  type: panel
  cards:
  - type: custom:mod-card
    card_mod:
      style:
        .: |
          :host { height: 100%; display: block; }
          ha-card { height: 100%; background: none; border: none; box-shadow: none; }
          hui-vertical-stack-card { height: 100%; }
        hui-vertical-stack-card$: |
          /* One screen-high column; the rooms grid (7th child) takes the height left over.
             Panel views flatten nested cards (square, borderless): restore the theme's look. */
          #root {
            height: 100%;
            box-sizing: border-box;
            padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
            overflow: hidden;
            --ha-card-border-radius: var(--ha-border-radius-lg, 12px);
            --ha-card-border-width: 1px;
          }
          #root > :nth-child(7) { flex: 1 1 0; min-height: 0; }
          #root > :nth-child(7) > * { height: 100%; }
          @media (min-width: 900px) {
            #root { width: 100%; max-width: 1100px; margin: 0 auto; padding: 16px; }
          }
    card:
      type: vertical-stack
      cards:
      - type: custom:mushroom-template-card
        entity: sensor.household_mode
        icon: '{% if is_state(''input_boolean.household_night'',''on'') %}mdi:weather-night{% elif is_state(''input_select.household_presence'',''Fuori
          casa'') %}mdi:home-export-outline{% else %}mdi:home-heart{% endif %}'
        color: '{% if is_state(''input_boolean.household_night'',''on'') %}indigo{% elif is_state(''input_select.household_presence'',''Fuori
          casa'') %}blue{% elif is_state(''input_select.household_presence'',''In casa'') %}green{% else %}grey{% endif %}'
        primary: '{{ states(''sensor.household_mode'') }}{{ '' · con ospiti'' if is_state(''input_boolean.household_guests'',''on'')
          else '''' }}'
        secondary: '{% set lights = ["light.guardaroba", "light.faretti_3", "light.piano", "light.balcone_3", "light.faretti2",
          "light.faretti1", "light.shellyplusrgbwpm_30c92257192c", "light.lampade", "light.faretti_2", "light.faretti_1",
          "light.presa_lume", "light.led", "light.pensili", "light.faretti_6", "light.balcone_4", "light.isola", "light.luce_specchio_2",
          "light.faretti_8", "light.doccia_2", "light.faretti_4", "light.porta", "light.faretti_9", "light.faretti_7", "light.lampade_2",
          "light.lume_libreria", "light.shellyplusrgbwpm_30c92258a17c", "light.led_2", "light.balcone", "light.shellydimmer2_24d7ebe4585d",
          "light.shellydimmer2_24d7ebe55395", "light.strip_led", "light.faretti", "light.luce_specchio", "light.specchio",
          "light.vasca", "light.faretti_5"] | select(''is_state'',''on'') | list | count %}{% set w = states(''sensor.household_open_windows'')
          | int(0) %}{% set d = is_state(''binary_sensor.front_door_door'',''on'') %}{% if is_state(''script.household_run_routine'',''on'')
          %}{{ states(''input_text.household_routine_name'') }} in corso…{% else %}{{ ''Videocamere spente'' if is_state(''binary_sensor.household_camera_privacy_verified'',''on'')
          else (''Videocamere accese'' if is_state(''binary_sensor.household_cameras_operating'',''on'') else ''Problema alle
          videocamere'') }} · {{ ''Tutto chiuso'' if w == 0 and not d else (''Porta aperta'' if w == 0 else ((''Porta e ''
          if d else '''') ~ w ~ ('' finestra'' if w == 1 else '' finestre'') ~ ('' aperte'' if d or w > 1 else '' aperta'')))
          }} · {{ ''Luci spente'' if lights == 0 else (lights ~ ('' luce accesa'' if lights == 1 else '' luci accese'')) }}{%
          endif %}'
        multiline_secondary: true
        badge_icon: '{% if is_state(''script.household_run_routine'',''on'') %}mdi:progress-clock{% elif is_state(''input_select.household_routine_status'',''Da
          controllare'') or is_state(''input_select.household_routine_status'',''Interrotta'') %}mdi:alert{% endif %}'
        badge_color: '{{ ''orange'' if is_state(''script.household_run_routine'',''on'') else ''red'' }}'
        tap_action:
          action: navigate
          navigation_path: '#sicurezza'
        hold_action:
          action: navigate
          navigation_path: /profile/general
      - type: custom:mushroom-chips-card
        alignment: justify
        chips:
        - type: template
          icon: mdi:thermometer
          icon_color: orange
          tap_action:
            action: navigate
            navigation_path: '#clima'
          content: '{% set t = ["climate.thermostat_6_thermostat", "climate.thermo_thermostat", "climate.thermo_7_thermostat",
            "climate.thermo_3_thermostat", "climate.thermo_8_thermostat", "climate.thermo_4_thermostat", "climate.thermo_5_thermostat"]
            | map(''state_attr'',''current_temperature'') | select(''number'') | list %}{{ (''%.1f'' | format(t | sum / t
            | count) | replace(''.'', '','')) ~ ''°'' if t else ''Clima'' }}'
          card_mod:
            style: |
              :host { display: block !important; }
              ha-card { width: 100% !important; box-sizing: border-box; justify-content: center; }
              ::slotted(span) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        - type: template
          icon: mdi:window-shutter
          icon_color: blue
          tap_action:
            action: navigate
            navigation_path: '#tapparelle'
          content: '{% set ns = namespace(o=0) %}{% for c in ["cover.shellyplus2pm_30c922774de4", "cover.shellyplus2pm_c4d8d5561ffc",
            "cover.shellyplus2pm_78ee4ccf104c", "cover.shellyplus2pm_8813bfd4933c", "cover.shellyplus2pm_2cbcbb2d92d8", "cover.shellyplus2pm_8813bfd0a3b8",
            "cover.shellyplus2pm_8813bfd0b9ec"] %}{% set p = state_attr(c, ''current_position'') %}{% if (p is number and
            p > 20) or (p is not number and is_state(c, ''open'')) %}{% set ns.o = ns.o + 1 %}{% endif %}{% endfor %}{{ ''Tutte
            chiuse'' if ns.o == 0 else (ns.o ~ ('' aperta'' if ns.o == 1 else '' aperte'')) }}'
          card_mod:
            style: |
              :host { display: block !important; }
              ha-card { width: 100% !important; box-sizing: border-box; justify-content: center; }
              ::slotted(span) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        - type: template
          tap_action:
            action: navigate
            navigation_path: '#sicurezza'
          icon: '{{ ''mdi:shield-lock'' if is_state(''binary_sensor.household_camera_privacy_verified'',''on'') else ''mdi:cctv''
            }}'
          icon_color: '{{ ''green'' if is_state(''binary_sensor.household_camera_privacy_verified'',''on'') else (''blue''
            if is_state(''binary_sensor.household_cameras_operating'',''on'') else ''orange'') }}'
          content: '{{ ''…'' if is_state(''script.household_run_routine'',''on'') else (''Spente'' if is_state(''binary_sensor.household_camera_privacy_verified'',''on'')
            else (''Accese'' if is_state(''binary_sensor.household_cameras_operating'',''on'') else ''Problema'')) }}'
          card_mod:
            style: |
              :host { display: block !important; }
              ha-card { width: 100% !important; box-sizing: border-box; justify-content: center; }
              ::slotted(span) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        - type: template
          icon: mdi:flash
          icon_color: amber
          tap_action:
            action: navigate
            navigation_path: '#consumi'
          content: '{{ states(''sensor.shellyemg3_dcb4d9c56334_energy_meter_0_potenza'') | int(0) ~ '' W'' if has_value(''sensor.shellyemg3_dcb4d9c56334_energy_meter_0_potenza'')
            else ''Consumi'' }}'
          card_mod:
            style: |
              :host { display: block !important; }
              ha-card { width: 100% !important; box-sizing: border-box; justify-content: center; }
              ::slotted(span) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        card_mod:
          style: |
            /* Four equal columns across the full width. */
            .chip-container { display: grid !important; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
            @media (max-width: 380px) { ha-card { --mush-chip-spacing: 4px; --mush-chip-font-size: 0.75rem; } }
      - type: grid
        columns: 4
        square: false
        cards:
        - type: custom:mushroom-template-card
          entity: script.household_good_morning
          primary: Buongiorno
          icon: mdi:weather-sunset-up
          color: amber
          vertical: true
          badge_icon: '{{ ''mdi:progress-clock'' if is_state(''script.household_run_routine'',''on'') and is_state(''input_text.household_routine_name'',''Buongiorno'')
            else '''' }}'
          badge_color: orange
          tap_action:
            action: perform-action
            perform_action: script.turn_on
            target:
              entity_id: script.household_good_morning
          icon_tap_action:
            action: perform-action
            perform_action: script.turn_on
            target:
              entity_id: script.household_good_morning
          hold_action:
            action: none
          card_mod:
            style: |
              /* Narrow phones: smaller labels so "Buongiorno"/"Buonanotte" are not truncated. */
              @media (max-width: 380px) {
