title: Casa
views:
- title: Casa
  path: casa
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Cosa facciamo?
      heading_style: title
    - type: tile
      entity: script.household_good_morning
      name: Buongiorno
      grid_options:
        columns: 6
      icon: mdi:weather-sunset-up
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.household_good_morning
      icon_tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.household_good_morning
    - type: tile
      entity: script.household_good_night
      name: Buonanotte
      grid_options:
        columns: 6
      icon: mdi:weather-night
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.household_good_night
        confirmation:
          text: Sono tutti a letto? Buonanotte attiva le videocamere e porta le cinque tapparelle alle posizioni
            notte.
      icon_tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.household_good_night
        confirmation:
          text: Sono tutti a letto? Buonanotte attiva le videocamere e porta le cinque tapparelle alle posizioni
            notte.
    - type: tile
      entity: script.household_leaving
      name: Usciamo
      grid_options:
        columns: 6
      icon: mdi:home-export-outline
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.household_leaving
        confirmation:
          text: Stanno uscendo tutti? Usciamo attiva le videocamere. Se qualcuno rimane, usa Annulla.
      icon_tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.household_leaving
        confirmation:
          text: Stanno uscendo tutti? Usciamo attiva le videocamere. Se qualcuno rimane, usa Annulla.
    - type: tile
      entity: script.household_arriving
      name: Rientro
      grid_options:
        columns: 6
      icon: mdi:home-import-outline
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.household_arriving
      icon_tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.household_arriving
    - type: conditional
      conditions:
      - entity: input_select.household_routine_status
        state_not: Pronta
      - entity: input_select.household_routine_status
        state_not: unknown
      - entity: input_select.household_routine_status
        state_not: unavailable
      card:
        type: markdown
        content: '{% set running = is_state(''script.household_run_routine'',''on'') %}

          {% set name = states(''input_text.household_routine_name'') %}

          {% if name in [''unknown'',''unavailable'',''''] %}

          Scegli una routine. Qui vedrai l’avanzamento e il risultato delle azioni.

          {% else %}

          ### {{ name }} · {{ states(''input_select.household_routine_status'') }}

          {% if running %}

          **{{ states(''input_text.household_routine_step'') }}**

          {% else %}

          {{ states(''input_text.household_routine_result'') }}

          {% endif %}


          **Videocamere:** {{ states(''input_text.household_routine_cameras'') }}


          **Tapparelle:** {{ states(''input_text.household_routine_shutters'') }}

          {% if not running and has_value(''input_datetime.household_routine_finished'') %}


          _Verifica delle {{ as_timestamp(states(''input_datetime.household_routine_finished'')) | timestamp_custom(''%H:%M
          · %d/%m'') }}_

          {% endif %}

          {% endif %}'
    - type: markdown
      content: '**Buonanotte:** solo quando tutti sono a letto. Usa **Rientro** per riattivare la privacy senza
        muovere le tapparelle.'
  - type: grid
    cards:
    - type: heading
      heading: La casa adesso
      heading_style: title
    - type: tile
      entity: sensor.household_open_windows
      name: Finestre
      grid_options:
        columns: 6
      icon: mdi:window-closed
    - type: tile
      entity: binary_sensor.front_door_door
      name: Ingresso
      grid_options:
        columns: 6
      icon: mdi:door-closed
    - type: markdown
      content: '{% set windows = [(''Cucina'', ''binary_sensor.kitchen_window_open'', ''binary_sensor.kitchen_window_tilted''),
        (''Sala da pranzo'', ''binary_sensor.window_sensor_1_window_1_open'', ''binary_sensor.window_sensor_1_window_1_tilted''),
        (''Soggiorno'', ''binary_sensor.window_sensor_1_window_2_open'', ''binary_sensor.window_sensor_1_window_2_tilted''),
        (''Camera Francesco sinistra'', ''binary_sensor.window_sensor_2_window_1_open'', ''binary_sensor.window_sensor_2_window_1_tilted''),
        (''Camera Francesco destra'', ''binary_sensor.window_sensor_2_window_2_open'', ''binary_sensor.window_sensor_2_window_2_tilted''),
        (''Studio'', ''binary_sensor.window_sensor_3_open'', ''binary_sensor.window_sensor_3_tilted''), (''Bagno
        grande'', ''binary_sensor.window_sensor_4_window_1_open'', ''binary_sensor.window_sensor_4_window_1_tilted''),
        (''Camera matrimoniale'', ''binary_sensor.window_sensor_4_window_2_open'', ''binary_sensor.window_sensor_4_window_2_tilted'')]
        %}

        {% for name,a,b in windows %}

        {% if is_state(a,''on'') %}• **{{ name }}:** aperta

        {% elif is_state(b,''on'') %}• **{{ name }}:** a ribalta

        {% elif not has_value(a) or not has_value(b) %}• **{{ name }}:** da verificare

        {% endif %}{% endfor %}

        {% if is_state(''binary_sensor.front_door_door'',''on'') %}• **Porta d’ingresso:** aperta{% elif not
        has_value(''binary_sensor.front_door_door'') %}• **Porta d’ingresso:** da verificare{% endif %}

        {% if is_state(''sensor.household_open_windows'',''0'') and is_state(''binary_sensor.front_door_door'',''off'')
        %}Porta e finestre chiuse.{% endif %}'
    - type: tile
      entity: input_boolean.household_guests
      name: Ospiti in casa
      grid_options:
        columns: 12
      icon: mdi:account-group
  - type: grid
    cards:
    - type: heading
      heading: Accesso rapido
      heading_style: title
    - type: tile
      entity: light.led
      name: Cucina
      icon: mdi:stove
      color: primary
      grid_options:
        columns: 6
      tap_action: &id001
        action: navigate
        navigation_path: /casa-famiglia/cucina
      icon_tap_action: *id001
      hide_state: true
    - type: tile
      entity: light.piano
      name: Soggiorno
      icon: mdi:sofa
      color: primary
      grid_options:
        columns: 6
      tap_action: &id002
        action: navigate
        navigation_path: /casa-famiglia/soggiorno
      icon_tap_action: *id002
      hide_state: true
    - type: tile
      entity: climate.thermo_8_thermostat
      name: Camera matrimoniale
      icon: mdi:bed-king
      color: primary
      grid_options:
        columns: 6
      tap_action: &id003
        action: navigate
        navigation_path: /casa-famiglia/camera_da_letto
      icon_tap_action: *id003
      state_content: current_temperature
    - type: tile
      entity: climate.thermo_7_thermostat
      name: Camera Francesco
      icon: mdi:bed
      color: primary
      grid_options:
        columns: 6
      tap_action: &id004
        action: navigate
        navigation_path: /casa-famiglia/room
      icon_tap_action: *id004
      state_content: current_temperature
    - type: tile
      entity: climate.thermo_3_thermostat
      name: Studio
      icon: mdi:desk
      color: primary
      grid_options:
        columns: 6
      tap_action: &id005
        action: navigate
        navigation_path: /casa-famiglia/office
      icon_tap_action: *id005
      state_content: current_temperature
  badges:
  - type: entity
    entity: sensor.household_mode
    name: Casa
    show_name: true
    show_state: true
    tap_action:
      action: more-info
  - type: entity
    entity: sensor.household_camera_status
    name: Videocamere
    show_name: true
    show_state: true
    tap_action:
      action: more-info
