- title: Sicurezza
  path: sicurezza
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Privacy e videocamere
      heading_style: title
    - type: tile
      entity: sensor.household_camera_status
      name: Stato videocamere
    - type: tile
      entity: binary_sensor.household_cameras_operating
      name: Video su tutte e tre
      grid_options:
        columns: 12
      icon: mdi:cctv
    - type: markdown
      content: '**Privacy attiva:** spegnimento fisico verificato su tutte e tre le videocamere.


        **Video attivo:** tutte e tre inviano immagini e hanno la registrazione abilitata. L’allarme intrusione
        deve ancora essere configurato.'
  - type: grid
    cards:
    - type: heading
      heading: Presenza e modalità
      heading_style: title
    - type: tile
      entity: sensor.household_mode
      name: Modalità della casa
      grid_options:
        columns: 12
    - type: tile
      entity: input_boolean.household_guests
      name: Ospiti restano in casa
      grid_options:
        columns: 12
    - type: tile
      entity: script.household_arriving
      name: Rientro
      grid_options:
        columns: 6
      icon: mdi:home-import-outline
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.household_arriving
      icon_tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.household_arriving
    - type: tile
      entity: script.household_leaving
      name: Usciamo
      grid_options:
        columns: 6
      icon: mdi:home-export-outline
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.household_leaving
        confirmation:
          text: Stanno uscendo tutti? Usciamo attiva le videocamere. Se qualcuno rimane, usa Annulla.
      icon_tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.household_leaving
        confirmation:
          text: Stanno uscendo tutti? Usciamo attiva le videocamere. Se qualcuno rimane, usa Annulla.
  - type: grid
    cards:
    - type: heading
      heading: Controllo videocamere
      heading_style: title
    - type: entities
      show_header_toggle: false
      entities:
      - entity: sensor.camera_1_camera_fps
        name: Soggiorno · immagini al secondo
      - entity: sensor.camera_2_camera_fps
        name: Ingresso · immagini al secondo
      - entity: sensor.camera_3_camera_fps
        name: Corridoio · immagini al secondo
  - type: grid
    cards:
    - type: heading
      heading: Porta e finestre
      heading_style: title
    - type: markdown
      content: '{% set windows = [(''Cucina'', ''binary_sensor.kitchen_window_open'', ''binary_sensor.kitchen_window_tilted''),
        (''Sala da pranzo'', ''binary_sensor.window_sensor_1_window_1_open'', ''binary_sensor.window_sensor_1_window_1_tilted''),
        (''Soggiorno'', ''binary_sensor.window_sensor_1_window_2_open'', ''binary_sensor.window_sensor_1_window_2_tilted''),
        (''Camera Francesco sinistra'', ''binary_sensor.window_sensor_2_window_1_open'', ''binary_sensor.window_sensor_2_window_1_tilted''),
        (''Camera Francesco destra'', ''binary_sensor.window_sensor_2_window_2_open'', ''binary_sensor.window_sensor_2_window_2_tilted''),
        (''Studio'', ''binary_sensor.window_sensor_3_open'', ''binary_sensor.window_sensor_3_tilted''), (''Bagno
        grande'', ''binary_sensor.window_sensor_4_window_1_open'', ''binary_sensor.window_sensor_4_window_1_tilted''),
        (''Camera matrimoniale'', ''binary_sensor.window_sensor_4_window_2_open'', ''binary_sensor.window_sensor_4_window_2_tilted'')]
        %}

        {% for name,a,b in windows %}

        {% if is_state(a,''on'') %}• **{{ name }}:** aperta

        {% elif is_state(b,''on'') %}• **{{ name }}:** a ribalta

        {% elif not has_value(a) or not has_value(b) %}• **{{ name }}:** da verificare

        {% endif %}{% endfor %}

        {% if is_state(''binary_sensor.front_door_door'',''on'') %}• **Porta d’ingresso:** aperta{% elif not
        has_value(''binary_sensor.front_door_door'') %}• **Porta d’ingresso:** da verificare{% endif %}

        {% if is_state(''sensor.household_open_windows'',''0'') and is_state(''binary_sensor.front_door_door'',''off'')
        %}Porta e finestre chiuse.{% endif %}'
  - type: grid
    cards:
    - type: heading
      heading: Visione videocamere
      heading_style: title
    - type: conditional
      conditions:
      - entity: binary_sensor.household_cameras_expected
        state: 'on'
      - entity: binary_sensor.household_camera_privacy_verified
        state: 'off'
      card:
        type: vertical-stack
        cards:
        - type: picture-entity
          entity: camera.cam_soggiorno
          name: Soggiorno
          camera_view: auto
          show_state: false
        - type: picture-entity
          entity: camera.camera_2
          name: Ingresso
          camera_view: auto
          show_state: false
        - type: picture-entity
          entity: camera.camera_3
          name: Corridoio
          camera_view: auto
          show_state: false
