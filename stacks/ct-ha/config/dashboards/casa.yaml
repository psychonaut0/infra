        icon: '{{ {''In corso'':''mdi:progress-clock'',''Da controllare'':''mdi:alert-circle-outline'',''Interrotta'':''mdi:close-circle-outline''}.get(states(''input_select.household_routine_status''),''mdi:information-outline'')
          }}'
