          ["sensor.household_window_guest_right", "Destra"], ["sensor.household_window_office", "Studio"], ["sensor.household_window_master",
          "Camera matrimoniale"], ["sensor.household_window_bathroom", "Bagno grande"]] %}{% set ns = namespace(o=[]) %}{%
          if is_state(''binary_sensor.front_door_door'',''on'') %}{% set ns.o = ns.o + [''Porta d’ingresso''] %}{% endif %}{%
          for e, n in w %}{% if not is_state(e,''Chiusa'') and has_value(e) %}{% set ns.o = ns.o + [n ~ '' ('' ~ states(e)|lower
          ~ '')''] %}{% endif %}{% endfor %}{{ ns.o | join('', '') }}'
        multiline_secondary: true
      - type: heading
        heading: Stanze
        heading_style: title
      - type: grid
        columns: 2
        square: false
        cards:
        - type: custom:button-card
          template: casa_room
          name: Ingresso
          icon: mdi:door
          variables:
            lights:
            - light.guardaroba
            - light.faretti_3
            windows: []
            door: true
          tap_action:
            action: navigate
            navigation_path: '#ingresso'
          icon_tap_action:
            action: perform-action
            perform_action: script.room_quick_lights
            data:
              lights:
              - light.guardaroba
              - light.faretti_3
              main:
              - light.faretti_3
        - type: custom:button-card
          template: casa_room
          name: Soggiorno
          icon: mdi:sofa
          variables:
