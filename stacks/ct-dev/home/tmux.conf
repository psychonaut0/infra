# ct-dev tmux — the persistence layer, not a preference.
set -g default-terminal "screen-256color"
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
# Long-running agent work: never let a pane close silently on exit.
set -g remain-on-exit off
set -g status-left "#[bold]ct-dev #[default]| "
set -g status-right "%Y-%m-%d %H:%M"
