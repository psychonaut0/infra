# ct-dev tmux — the persistence layer, not a preference.
# tmux-256color, not screen-256color: the latter cannot express modifier+key
# combinations, so Shift+Enter (and friends) arrive indistinguishable from a
# plain Enter. Requires the tmux-256color terminfo entry on the host — present
# via ncurses on both Arch and Debian.
set -g default-terminal "tmux-256color"

# Pass through the extended key encoding (CSI u) that kitty and other modern
# terminals use. Without these two, Shift+Enter never reaches the application
# inside tmux — which breaks multi-line input in Claude Code.
set -s extended-keys on
set -as terminal-features '*:extkeys'
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
# Long-running agent work: never let a pane close silently on exit.
set -g remain-on-exit off
set -g status-left "#[bold]ct-dev #[default]| "
set -g status-right "%Y-%m-%d %H:%M"
