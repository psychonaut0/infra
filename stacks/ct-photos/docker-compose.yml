services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.1.0
    container_name: immich_server
    restart: unless-stopped
    ports:
      - "2283:2283"
    environment:
      DB_HOSTNAME: immich_postgres
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOSTNAME: immich_redis
      IMMICH_MEDIA_LOCATION: /usr/src/app/upload
      TZ: Europe/Rome
    volumes:
      - /mnt/immich/data:/usr/src/app/upload
    depends_on:
      - immich-postgres
      - immich-redis

  immich-machine-learning:
    # -cuda variant: runs CLIP/face models on the GTX 1650 Super. The plain
    # image is CPU-only, so the old renderD128 passthrough was never used.
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0-cuda
    container_name: immich_machine_learning
    restart: unless-stopped
    environment:
      TZ: Europe/Rome
    volumes:
      - /mnt/immich/cache:/cache
    # Explicit nodes, not just the reservation: with no-cgroups=true (required
    # in LXC) the NVIDIA hook no longer whitelists the devices, so Docker's
    # device cgroup blocks them and CUDA reports "no CUDA-capable device".
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # DB lives on the mergerfs HDD pool, not an SSD — see docs/hardware.md
      DB_STORAGE_TYPE: "HDD"
    volumes:
      - /mnt/immich/db:/var/lib/postgresql/data
    shm_size: 128mb

  immich-redis:
    image: redis:6.2-alpine
    container_name: immich_redis
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping || exit 1

  portainer-agent:
    image: portainer/agent:latest
    container_name: portainer-agent
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
