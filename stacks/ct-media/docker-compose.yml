services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
      - "8920:8920"
      - "1900:1900/udp"
      - "7359:7359/udp"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Rome
      DOCKER_MODS: linuxserver/mods:jellyfin-opencl-intel
    volumes:
      - /mnt/mediaserver/jellyfin/config:/config
      - /mnt/mediaserver/movies:/data/movies
      - /mnt/mediaserver/series:/data/tvshows
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Rome
    volumes:
      - /mnt/mediaserver/sonarr/config:/config
      - /mnt/mediaserver/series:/tv
      - /mnt/mediaserver/downloads:/downloads

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Rome
    volumes:
      - /mnt/mediaserver/radarr/config:/config
      - /mnt/mediaserver/movies:/movies
      - /mnt/mediaserver/downloads:/downloads

  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    restart: unless-stopped
    ports:
      - "8112:8112"
      - "6881:6881"
      - "6881:6881/udp"
      - "58846:58846"
      - "58946:58946"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Rome
    volumes:
      - /mnt/mediaserver/deluge/config:/config
      - /mnt/mediaserver/downloads:/downloads

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Rome
    volumes:
      - /mnt/mediaserver/prowlarr/config:/config
      - /mnt/mediaserver/downloads:/downloads

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      TZ: Europe/Rome

  portainer-agent:
    image: portainer/agent:latest
    container_name: portainer-agent
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
