services:
  mc-vanilla:
    image: itzg/minecraft-server:latest
    container_name: mc-vanilla
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: "PURPUR"
      VERSION: "1.21.11"
      MEMORY: "4G"
      USE_AIKAR_FLAGS: "true"
      MAX_PLAYERS: "20"
      DIFFICULTY: "hard"
      VIEW_DISTANCE: "16"
      SIMULATION_DISTANCE: "10"
      MOTD: "Un server tutto mio, con Blackjack e squillo di lusso!"
      ONLINE_MODE: "TRUE"
      ENFORCE_WHITELIST: "true"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD_VANILLA}"
      RCON_PORT: "25575"
      # BlueMap (83557) for 3D web map at http://map.lan.
      # Spark is already bundled into Purpur — no SPIGET install needed.
      SPIGET_RESOURCES: "83557"
      TZ: "Europe/Rome"
    ports:
      - "25565:25565/tcp"
      - "25575:25575/tcp"
      - "8100:8100/tcp"
    volumes:
      - ./data/vanilla:/data
    networks:
      - gamesnet
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 3

  mc-modded:
    image: itzg/minecraft-server:latest
    container_name: mc-modded
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "LATEST"
      MEMORY: "8G"
      MAX_PLAYERS: "10"
      DIFFICULTY: "normal"
      MOTD: "Modded | 192.168.3.14:25566"
      OPS: ""
      WHITELIST: ""
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD_MODDED}"
      RCON_PORT: "25575"
      TZ: "Europe/Rome"
    ports:
      - "25566:25565/tcp"
      - "25576:25575/tcp"
    volumes:
      - ./data/modded:/data
    networks:
      - gamesnet
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 3

  playit-agent:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: playit-agent
    restart: unless-stopped
    environment:
      # Image reads SECRET_KEY; keep PLAYIT_SECRET in .env for naming clarity.
      SECRET_KEY: "${PLAYIT_SECRET}"
    volumes:
      - playit-data:/etc/playit
    networks:
      - gamesnet
    depends_on:
      - mc-vanilla
      - mc-modded

  backup-vanilla:
    image: itzg/mc-backup:latest
    container_name: backup-vanilla
    restart: unless-stopped
    environment:
      RCON_HOST: "mc-vanilla"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD_VANILLA}"
      BACKUP_INTERVAL: "24h"
      INITIAL_DELAY: "30m"
      PRUNE_BACKUPS_DAYS: "14"
      PAUSE_IF_NO_PLAYERS: "true"
      BACKUP_NAME: "world"
      DEST_DIR: "/backups"
      TZ: "Europe/Rome"
    volumes:
      - ./data/vanilla:/data:ro
      - /mnt/archives/vanilla:/backups
    networks:
      - gamesnet
    depends_on:
      - mc-vanilla

  backup-modded:
    image: itzg/mc-backup:latest
    container_name: backup-modded
    restart: unless-stopped
    environment:
      RCON_HOST: "mc-modded"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD_MODDED}"
      BACKUP_INTERVAL: "24h"
      INITIAL_DELAY: "30m"
      PRUNE_BACKUPS_DAYS: "14"
      PAUSE_IF_NO_PLAYERS: "true"
      BACKUP_NAME: "world"
      DEST_DIR: "/backups"
      TZ: "Europe/Rome"
    volumes:
      - ./data/modded:/data:ro
      - /mnt/archives/modded:/backups
    networks:
      - gamesnet
    depends_on:
      - mc-modded

networks:
  gamesnet:
    driver: bridge

volumes:
  playit-data:
