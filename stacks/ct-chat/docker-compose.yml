name: ct-chat

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.0
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Bind mount, NOT a named volume: keeps state inside /opt/stacks so the
      # ct-backup full-stack rsync captures it. See README.md.
      - ./data:/app/backend/data
    environment:
      TZ: "Europe/Rome"

      # --- Identity / auth ---
      WEBUI_URL: ${WEBUI_URL}
      # Signs JWTs and encrypts data at rest. Set explicitly so sessions survive
      # a data-directory restore instead of being regenerated into ./data.
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      # Persistent ConfigVar — seeds the DB on FIRST boot only. After that the
      # database wins; change it in Admin Panel -> Settings -> General.
      ENABLE_SIGNUP: "${ENABLE_SIGNUP}"
      # Safety net: even a signup leak cannot self-approve.
      DEFAULT_USER_ROLE: pending

      # --- Chat (OpenRouter) ---
      #
      # IMPORTANT: the docs state each per-slot OpenAI-compatible base URL
      # "defaults to ${OPENAI_API_BASE_URL}". That is NOT what happens at
      # first-boot seeding — VERIFIED 2026-07-30 on v0.11.0, where rag.*,
      # audio.stt.*, audio.tts.* and image_generation.* all seeded to the
      # literal "https://api.openai.com/v1" with an EMPTY key, so every
      # non-chat slot would have failed. Every slot is therefore set
      # explicitly below. Do not "simplify" these away.
      OPENAI_API_BASE_URL: https://openrouter.ai/api/v1
      OPENAI_API_KEY: ${OPENROUTER_API_KEY}

      # --- Embeddings. MANDATORY: empty engine means SentenceTransformers,
      # ~500MB per worker, which does not fit the 2048MB allocation. ---
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: openai/text-embedding-3-small
      RAG_OPENAI_API_BASE_URL: https://openrouter.ai/api/v1
      RAG_OPENAI_API_KEY: ${OPENROUTER_API_KEY}

      # --- Speech-to-text. MANDATORY: empty engine runs a local Whisper
      # instance on the backend. ---
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_MODEL: openai/gpt-4o-mini-transcribe
      AUDIO_STT_OPENAI_API_BASE_URL: https://openrouter.ai/api/v1
      AUDIO_STT_OPENAI_API_KEY: ${OPENROUTER_API_KEY}

      # --- Text-to-speech. AUDIO_TTS_VOICE is specific to AUDIO_TTS_MODEL and
      # cannot be carried across a model swap. ---
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_MODEL: hexgrad/kokoro-82m
      AUDIO_TTS_VOICE: ${AUDIO_TTS_VOICE}
      AUDIO_TTS_OPENAI_API_BASE_URL: https://openrouter.ai/api/v1
      AUDIO_TTS_OPENAI_API_KEY: ${OPENROUTER_API_KEY}

      # --- Image generation ---
      #
      # IMAGE_SIZE must be set: Open WebUI defaults to 512x512 and DOES send it
      # (routers/images.py builds {'size': form_data.size or IMAGE_SIZE}), but
      # 512x512 is below the minimum pixel budget of current image models.
      # VERIFIED 2026-07-31: google/gemini-2.5-flash-image returns 400 "Request
      # contains an invalid argument" at 512x512 and 200 at 1024x1024;
      # openai/gpt-image-2 returns 400 "Requested resolution is below the
      # current minimum pixel budget". Omitting size also works, but the UI's
      # size selector can reintroduce it, so pin a valid value instead.
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_ENGINE: openai
      IMAGE_GENERATION_MODEL: google/gemini-2.5-flash-image
      IMAGE_SIZE: 1024x1024
      IMAGES_OPENAI_API_BASE_URL: https://openrouter.ai/api/v1
      IMAGES_OPENAI_API_KEY: ${OPENROUTER_API_KEY}

      # --- Web search (Brave). WEB_SEARCH_RESULT_COUNT is left at its default
      # of 3. CONCURRENT_REQUESTS=1 is the documented setting for Brave's free
      # tier. BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL removes the largest
      # latency term ahead of Cloudflare's fixed 100s ceiling (OWUI #16747). ---
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: brave
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY}
      WEB_SEARCH_CONCURRENT_REQUESTS: "1"
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: "true"
    healthcheck:
      # 127.0.0.1, not localhost — avoids the IPv6-refusal trap that bit
      # ct-portfolio's busybox wget healthcheck.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  portainer-agent:
    image: portainer/agent:latest
    container_name: portainer-agent
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
