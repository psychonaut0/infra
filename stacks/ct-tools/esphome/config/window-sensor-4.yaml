esphome:
  name: window-sensor-4
  friendly_name: Window sensor 4
# Room not decided yet: the area is assigned in Home Assistant.

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

web_server:
  port: 80

logger:
  # Pinned deliberately: the C3's native USB is the console, which keeps
  # UART0 (GPIO20/21) free and the USB pins (GPIO18/19) out of reach.
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret window_sensor_4_api_key

ota:
  - platform: esphome
    password: !secret window_sensor_4_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # IoT VLAN: mDNS can't cross from ct-tools' subnet, so the dashboard/CLI
  # connect to this IP for logs/OTA. Fixed-IP reservation in UniFi (2026-10-30).
  use_address: 192.168.2.119
  ap:
    ssid: "Window sensor 4 Fallback"
    password: !secret window_sensor_4_ap_password

captive_portal:

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

# ESP32-C3 pin budget for reeds (input, pull-up, reed to GND):
#   safe:  GPIO0, 1, 3, 4, 5, 6, 7, 10, 20  -> up to 4 windows per board
#   avoid: GPIO2, 8, 9  strapping pins — a reed held closed at power-on can
#                       stop the board booting (GPIO9 low = download mode)
#          GPIO21       UART0 TX: the ROM prints its boot log there, driving
#                       the pin into a closed reed (add 1k in series if used)
#          GPIO18, 19   native USB D-/D+, the console and flashing port
#          GPIO12-17    internal flash on most C3 modules
packages:
  window_1: !include
    file: common/window-subdevice.yaml
    vars:
      window_id: w1
      device_name: "Window sensor 4 - Window 1"
      tilt_pin: GPIO5
      open_pin: GPIO6
      magnet_at_position: "false"
  window_2: !include
    file: common/window-subdevice.yaml
    vars:
      window_id: w2
      device_name: "Window sensor 4 - Window 2"
      tilt_pin: GPIO4
      open_pin: GPIO3
      magnet_at_position: "false"
