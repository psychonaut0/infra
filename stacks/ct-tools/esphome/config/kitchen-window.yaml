esphome:
  name: kitchen-window
  friendly_name: Kitchen window

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

web_server:
  port: 80

logger:
  # Pinned deliberately: the C3's native USB is the console, which keeps
  # UART0 (GPIO20/21) free and the USB pins (GPIO18/19) out of reach.
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret window1_api_key

ota:
  - platform: esphome
    password: !secret window1_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Device is on the IoT VLAN; mDNS (kitchen-window.local) can't cross from
  # ct-tools' subnet, so the dashboard/CLI connect to this IP for logs/OTA.
  # Fixed-IP reservation in UniFi (2026-10-29).
  use_address: 192.168.2.114
  ap:
    ssid: "Window-1 Fallback Hotspot"
    password: !secret window1_ap_password

captive_portal:

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

# ESP32-C3 pin budget for reeds (input, pull-up, reed to GND):
#   safe:  GPIO0, 1, 3, 4, 5, 6, 7, 10, 20  -> up to 4 windows per board
#   avoid: GPIO2, 8, 9  strapping pins — a reed held closed at power-on can
#                       stop the board booting (GPIO9 low = download mode)
#          GPIO21       UART0 TX: the ROM prints its boot log there, driving
#                       the pin into a closed reed (add 1k in series if used)
#          GPIO18, 19   native USB D-/D+, the console and flashing port
#          GPIO12-17    internal flash on most C3 modules
# Add another sash by copying the block below with a new window_id and
# a free pin pair, e.g. GPIO4/GPIO3, GPIO7/GPIO10, GPIO0/GPIO1.
packages:
  window_1: !include
    file: common/window.yaml
    vars:
      window_id: w1
      name_prefix: ""
      tilt_pin: GPIO5
      open_pin: GPIO6
      magnet_at_position: "false"
