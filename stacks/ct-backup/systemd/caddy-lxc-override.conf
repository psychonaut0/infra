[Service]
# Caddy's upstream systemd unit uses PrivateTmp and ProtectSystem, which rely
# on mount namespaces that aren't reliably available inside a privileged LXC.
# Disable them so Caddy starts cleanly; we retain AmbientCapabilities so
# Caddy keeps CAP_NET_BIND_SERVICE for port 80.
#
# Install at: /etc/systemd/system/caddy.service.d/lxc-override.conf
PrivateTmp=false
ProtectSystem=false
