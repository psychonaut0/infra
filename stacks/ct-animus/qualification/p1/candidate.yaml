  - model: authentik_policies_expression.expressionpolicy
    id: issuance-closed-policy
    identifiers: {name: p1-mechanism-issuance-closed}
    attrs:
      execution_logging: false
      expression: |
        # Mandatory application policy, not a conditional flow-stage Deny.
        # Checkpoint 1 mechanism-only rehearsal has no qualified minting boundary.
        # Keep every new application authorization closed even after normal flow success.
        return False
  - model: authentik_policies_expression.expressionpolicy
    id: bootstrap-entry-policy
    identifiers: {name: p1-mechanism-bootstrap-entry}
    attrs:
      execution_logging: false
      expression: |
        # Supported operator group control; positive Prompt validation, no grants.
        try:
            import multiprocessing
            from authentik.flows.views.executor import SESSION_KEY_PLAN
            process = multiprocessing.current_process()
            if type(process).__name__ != "_MainProcess" or process.daemon:
                return False
            user = request.http_request.session[SESSION_KEY_PLAN].context.get("pending_user")
