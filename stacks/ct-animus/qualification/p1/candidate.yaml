                if event.context.get("auth_method") != "password" or args.get("hub_authentication_policy") != "animus-password-totp-mechanism-v2":
                    return None
                if args.get("hub_policy_flow") != flow or args.get("hub_policy_subject") != user.pk:
                    return None
                nonce = args.get("hub_policy_execution")
                if not isinstance(nonce, str) or not re.fullmatch(r"[0-9a-f]{32}", nonce):
                    return None
                started = args.get("hub_factor_time")
                now = time.time()
                if type(started) is not int or started <= 0 or not started <= event.created.timestamp() <= now:
                    return None
                if require_fresh and not 0 <= now - started <= 300:
                    return None
                devices = args.get("mfa_devices")
                if not isinstance(devices, list) or not devices:
                    return None
                if any(not isinstance(d, dict) or d.get("app") != "authentik_stages_authenticator_totp" or d.get("model_name") != "totpdevice" for d in devices):
                    return None
                return {"subject": user.pk, "event": str(event.pk), "event_time": event.created.isoformat(),
                        "factor_time": started, "execution": nonce, "flow": flow,
                        "policy": args["hub_authentication_policy"], "provider": str(provider.pk), "client": provider.client_id}
            except Exception:
                return None
        try:
            from authentik.events.signals import get_login_event
            if token.provider_id != provider.pk or not token.session:
                return {}
            event = get_login_event(token.session)
            if event is None or event.created != token.auth_time or token.user_id != token.user.pk:
                return {}
            proof = event_proof(event, token.user, provider, False)
            if proof is None:
                return {}
            return {"hub_authentication_policy": proof["policy"], "hub_factor_time": proof["factor_time"]}
        except Exception:
            return {}
