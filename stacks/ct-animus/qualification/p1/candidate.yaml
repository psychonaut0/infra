    id: consent
    identifiers: {name: p1-mechanism-consent}
    attrs: {mode: always_require}
  - model: authentik_policies_expression.expressionpolicy
    id: entry-policy
    identifiers: {name: p1-mechanism-entry}
    attrs:
      execution_logging: false
      expression: |
        # Mandatory Prompt validation: True advances, False/error cannot advance.
        try:
            import multiprocessing
            import re
            import time
            import uuid
            from authentik.events.signals import get_login_event
            from authentik.flows.views.executor import SESSION_KEY_PLAN
            process = multiprocessing.current_process()
            if type(process).__name__ != "_MainProcess" or process.daemon:
                return False
            http = request.http_request
            plan = http.session[SESSION_KEY_PLAN]
            binding = plan.bindings[0]
            flow = str(plan.flow_pk)
            if binding.stage.name != "p1-mechanism-normal-entry" or binding.order != 0 or binding.target_id.hex != flow:
                return False
            context = plan.context
            if not isinstance(context, dict) or not re.fullmatch(r"[0-9a-f]{32}", flow):
                return False
            if any(key in context for key in ("hub_p1_execution", "auth_method", "auth_method_args", "is_restored", "is_redirected")):
                return False
            principal = http.user.pk if http.user.is_authenticated else None
            event = get_login_event(http) if principal is not None else None
            if principal is not None and (event is None or event.user.get("pk") != principal):
                return False
            context["hub_p1_execution"] = {
                "policy": "animus-password-totp-mechanism-v2", "flow": flow,
                "nonce": uuid.uuid4().hex, "factor_time": int(time.time()),
                "initial_session_user": principal, "initial_login_event": str(event.pk) if event else None,
            }
            http.session[SESSION_KEY_PLAN] = plan
            return True
        except Exception:
            return False
  - model: authentik_policies_expression.expressionpolicy
    id: final-policy
    identifiers: {name: p1-mechanism-final}
    attrs:
      execution_logging: false
      expression: |
        # Positive mandatory Prompt validation. No client prompt value is authority.
        try:
            import multiprocessing
            import re
            import time
            from authentik.events.signals import get_login_event
            from authentik.flows.views.executor import SESSION_KEY_PLAN
            process = multiprocessing.current_process()
            if type(process).__name__ != "_MainProcess" or process.daemon:
                return False
            http = request.http_request
            plan = http.session[SESSION_KEY_PLAN]
            binding = plan.bindings[0]
            if binding.stage.name != "p1-mechanism-normal-final" or binding.target_id.hex != plan.flow_pk:
                return False
            context = plan.context
            if "is_restored" in context or "is_redirected" in context:
                return False
            state = context.get("hub_p1_execution")
            expected = {"policy", "flow", "nonce", "factor_time", "initial_session_user", "initial_login_event"}
            if not isinstance(state, dict) or set(state) != expected:
                return False
            if state["policy"] != "animus-password-totp-mechanism-v2" or state["flow"] != plan.flow_pk:
                return False
            if not isinstance(state["nonce"], str) or not re.fullmatch(r"[0-9a-f]{32}", state["nonce"]):
                return False
            started = state["factor_time"]
            if type(started) is not int or started <= 0 or not 0 <= time.time() - started <= 300:
                return False
            principal = http.user.pk if http.user.is_authenticated else None
            event = get_login_event(http) if principal is not None else None
            if principal != state["initial_session_user"] or (str(event.pk) if event else None) != state["initial_login_event"]:
                return False
            user = context.get("pending_user")
            if user is None or not user.pk or not user.is_active or user.is_superuser:
                return False
            if not ak_is_group_member(user, name="p1-mechanism-normal") or context.get("auth_method") != "password":
                return False
            args = context.get("auth_method_args")
            if not isinstance(args, dict) or not isinstance(args.get("mfa_devices"), list) or not args["mfa_devices"]:
                return False
            for device in args["mfa_devices"]:
                if type(device).__name__ != "TOTPDevice" or not device.confirmed or device.user_id != user.pk:
                    return False
            marker = {"hub_authentication_policy": state["policy"], "hub_factor_time": started,
                      "hub_policy_flow": state["flow"], "hub_policy_execution": state["nonce"],
                      "hub_policy_subject": user.pk}
            if any(key in args and args[key] != value for key, value in marker.items()):
                return False
            args.update(marker)
            http.session[SESSION_KEY_PLAN] = plan
            return True
        except Exception:
            return False
  - model: authentik_policies_expression.expressionpolicy
    id: pkce-policy
    identifiers: {name: p1-mechanism-pkce}
    attrs:
      execution_logging: false
      expression: |
        # The token endpoint separately validates code ownership/verifier or refresh.
        try:
            context = request.context
            path = request.http_request.path
            grant = context.get("oauth_grant_type")
            alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"
            if path == "/application/o/authorize/":
                challenge = context.get("oauth_code_challenge")
                return (
                    grant == "authorization_code"
                    and context.get("oauth_response_type") == "code"
                    and context.get("oauth_redirect_uri") == "dev.animusstudio.alkion.dev:/oauth2redirect"
                    and context.get("oauth_code_challenge_method") == "S256"
                    and isinstance(challenge, str) and len(challenge) == 43
                    and all(c in alphabet for c in challenge)
                )
            if path == "/application/o/token/":
                if grant == "authorization_code":
                    verifier = context.get("oauth_code_verifier")
                    return isinstance(verifier, str) and 43 <= len(verifier) <= 128 and all(c in alphabet + ".~" for c in verifier)
                return grant == "refresh_token"
            return False
        except Exception:
            return False
  - model: authentik_policies_expression.expressionpolicy
    id: application-policy
    identifiers: {name: p1-mechanism-application}
    attrs:
      execution_logging: false
      expression: |
        def event_proof(event, user, provider, require_fresh):
            try:
                import re
                import time
                if event is None or user is None or not user.pk or not user.is_active or user.is_superuser:
                    return None
                if not ak_is_group_member(user, name="p1-mechanism-normal"):
                    return None
                if event.action != "login" or event.user.get("pk") != user.pk or provider.client_id != "alkion-lan":
                    return None
                args = event.context.get("auth_method_args", {})
                flow = provider.authentication_flow_id.hex
                if event.context.get("auth_method") != "password" or args.get("hub_authentication_policy") != "animus-password-totp-mechanism-v2":
                    return None
                if args.get("hub_policy_flow") != flow or args.get("hub_policy_subject") != user.pk:
                    return None
                nonce = args.get("hub_policy_execution")
                if not isinstance(nonce, str) or not re.fullmatch(r"[0-9a-f]{32}", nonce):
                    return None
                started = args.get("hub_factor_time")
                now = time.time()
                if type(started) is not int or started <= 0 or not started <= event.created.timestamp() <= now:
                    return None
                if require_fresh and not 0 <= now - started <= 300:
                    return None
                devices = args.get("mfa_devices")
                if not isinstance(devices, list) or not devices:
                    return None
                if any(not isinstance(d, dict) or d.get("app") != "authentik_stages_authenticator_totp" or d.get("model_name") != "totpdevice" for d in devices):
                    return None
                return {"subject": user.pk, "event": str(event.pk), "event_time": event.created.isoformat(),
                        "factor_time": started, "execution": nonce, "flow": flow,
                        "policy": args["hub_authentication_policy"], "provider": str(provider.pk), "client": provider.client_id}
            except Exception:
                return None
        try:
            from authentik.events.signals import get_login_event
            http = request.http_request
            if http.path != "/application/o/authorize/" or not http.user.is_authenticated or http.user.pk != request.user.pk:
                return False
            return event_proof(get_login_event(http), request.user, request.obj.provider, True) is not None
        except Exception:
            return False
  - model: authentik_policies_expression.expressionpolicy
    id: authorization-entry-policy
    identifiers: {name: p1-mechanism-authorization-entry}
    attrs:
      execution_logging: false
      expression: |
        def event_proof(event, user, provider, require_fresh):
            try:
                import re
                import time
                if event is None or user is None or not user.pk or not user.is_active or user.is_superuser:
                    return None
                if not ak_is_group_member(user, name="p1-mechanism-normal"):
                    return None
                if event.action != "login" or event.user.get("pk") != user.pk or provider.client_id != "alkion-lan":
                    return None
                args = event.context.get("auth_method_args", {})
                flow = provider.authentication_flow_id.hex
                if event.context.get("auth_method") != "password" or args.get("hub_authentication_policy") != "animus-password-totp-mechanism-v2":
                    return None
                if args.get("hub_policy_flow") != flow or args.get("hub_policy_subject") != user.pk:
                    return None
                nonce = args.get("hub_policy_execution")
                if not isinstance(nonce, str) or not re.fullmatch(r"[0-9a-f]{32}", nonce):
                    return None
                started = args.get("hub_factor_time")
                now = time.time()
                if type(started) is not int or started <= 0 or not started <= event.created.timestamp() <= now:
                    return None
                if require_fresh and not 0 <= now - started <= 300:
                    return None
                devices = args.get("mfa_devices")
                if not isinstance(devices, list) or not devices:
                    return None
                if any(not isinstance(d, dict) or d.get("app") != "authentik_stages_authenticator_totp" or d.get("model_name") != "totpdevice" for d in devices):
                    return None
                return {"subject": user.pk, "event": str(event.pk), "event_time": event.created.isoformat(),
                        "factor_time": started, "execution": nonce, "flow": flow,
                        "policy": args["hub_authentication_policy"], "provider": str(provider.pk), "client": provider.client_id}
            except Exception:
                return None
        try:
            import multiprocessing
            from authentik.events.signals import get_login_event
            from authentik.flows.views.executor import SESSION_KEY_PLAN
            process = multiprocessing.current_process()
            if type(process).__name__ != "_MainProcess" or process.daemon:
                return False
            http = request.http_request
            plan = http.session[SESSION_KEY_PLAN]
            binding = plan.bindings[0]
            if binding.stage.name != "p1-mechanism-authorization-entry" or binding.target_id.hex != plan.flow_pk:
                return False
            context = plan.context
            if "hub_p1_authorization" in context or "is_restored" in context or "is_redirected" in context:
                return False
            params = context["goauthentik.io/providers/oauth2/params"]
            app = context["application"]
            if app.provider_id != params.provider.pk or params.client_id != "alkion-lan" or params.provider.client_id != params.client_id:
                return False
            if params.grant_type != "authorization_code" or params.code_challenge_method != "S256" or params.redirect_uri != "dev.animusstudio.alkion.dev:/oauth2redirect":
                return False
            if not http.user.is_authenticated or http.user.pk != request.user.pk:
                return False
            proof = event_proof(get_login_event(http), request.user, params.provider, True)
            if proof is None:
                return False
            proof.update({"redirect_uri": params.redirect_uri, "challenge": params.code_challenge,
                          "challenge_method": params.code_challenge_method, "grant": params.grant_type, "response_type": params.response_type})
            context["hub_p1_authorization"] = proof
            http.session[SESSION_KEY_PLAN] = plan
            return True
        except Exception:
            return False
